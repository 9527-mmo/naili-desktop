<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奶栗 Gen1 v1.1 手机审核</title><style>
*{box-sizing:border-box}body{margin:0;background:#27191d;color:#ffe6c5;font:15px system-ui,-apple-system,sans-serif;padding:16px}main{max-width:650px;margin:auto}h1{font-size:23px}p{line-height:1.6;color:#dfc1b5}.notice{background:#452b32;border:1px solid #a87860;padding:12px;border-radius:8px}button,.file{display:inline-block;background:#6b453e;color:#fff1d7;border:1px solid #c4916c;border-radius:7px;padding:11px;cursor:pointer;font:inherit}button.active{background:#e2b381;color:#2b1b1f}.file input{display:none}.stage{background:#38252b;border:2px solid #a66b53;border-radius:12px;margin:16px 0;padding:15px;text-align:center}.stage canvas{width:min(100%,320px);height:140px;image-rendering:pixelated;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{font-size:13px;padding:10px 3px}.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.row button{flex:1}textarea{width:100%;height:90px;padding:10px;background:#39252e;border:1px solid #a87860;color:white;border-radius:7px;font:inherit}#board{width:100%;margin-top:12px}small{color:#c8aca2}</style></head><body><main>
<h1>🐰 奶栗 Gen 1 v1.1 · 手机审核</h1><p class="notice">这是<strong>原图审核模式</strong>：为避免再出现替代造型，请在手机上选择你已确认的 v1.1 审核图。网页会在本机保存图片，之后打开无需重新选择。原图不会上传到服务器。动作预览直接裁取原图，仍属排版图分区检查，不代表透明动画帧已完成。</p>
<label class="file">📷 选择已确认的 v1.1 原图<input id="upload" type="file" accept="image/*"></label><span id="fileStatus"> 尚未加载原图</span>
<div class="stage"><h3 id="name">待机·呼吸</h3><canvas id="frame" width="300" height="140"></canvas><p id="progress">请先选择审核图</p></div>
<div class="row"><button id="pause">⏸ 暂停</button><button id="speed">1× 速度</button></div><h3>动作选择</h3><div class="grid" id="actions"></div>
<h3>当前动作审核</h3><div class="row" id="rates"><button data-rate="通过">✓ 通过</button><button data-rate="修改">✎ 修改</button><button data-rate="待定">◷ 待定</button></div><textarea id="notes" placeholder="修改意见……"></textarea><div class="row"><button id="export">导出审核结果</button><button id="copy">复制审核意见</button></div>
<h3>原始审核图对照</h3><img id="board" alt="请先选择 Gen1 v1.1 原图"><small>审核记录保存在当前浏览器，只有你确认后才进入正式素材库。</small></main>
<script>
const data=[['idle','待机呼吸',12,555,145,1518,225,1800],['walk','行走',8,557,269,985,340,900],['run','奔跑',12,1006,269,1520,340,800],['turn','转身',8,557,388,985,457,1100],['sit','坐下起身',8,1007,389,1520,459,1400],['sniff','嗅闻探索',8,555,477,1035,558,1200],['food','发现食物',6,1071,478,1518,558,950],['grab','抢食',12,558,575,1517,648,1600],['eat','返回进食',16,558,667,1517,748,2000],['groom','梳理毛发',12,558,777,1044,852,1600],['toilet','如厕',8,1082,778,1518,852,1500],['sleep','休息睡眠',12,558,901,1040,978,2500],['jump','开心跳跃',8,1082,900,1518,981,1100]];
const $=id=>document.getElementById(id);let selected='idle',playing=true,speed=1,elapsed=0,last=performance.now(),image=null,reviews={};try{reviews=JSON.parse(localStorage.getItem('naili-v11-mobile-review')||'{}')}catch{}
const cv=$('frame'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
function save(){reviews[selected]={...(reviews[selected]||{}),notes:$('notes').value};localStorage.setItem('naili-v11-mobile-review',JSON.stringify(reviews))}
function select(id){save();selected=id;elapsed=0;const d=data.find(x=>x[0]===id);$('name').textContent=d[1];$('notes').value=reviews[id]?.notes||'';document.querySelectorAll('[data-action]').forEach(b=>b.classList.toggle('active',b.dataset.action===id));document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('active',b.dataset.rate===reviews[id]?.rating))}
data.forEach(d=>{let b=document.createElement('button');b.textContent=d[1];b.dataset.action=d[0];b.onclick=()=>select(d[0]);$('actions').append(b)});
document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{reviews[selected]={...(reviews[selected]||{}),rating:b.dataset.rate};save();document.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('active',x===b))});
$('notes').oninput=save;$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'⏸ 暂停':'▶ 播放'};$('speed').onclick=()=>{speed=speed===1?.5:speed===.5?2:1;$('speed').textContent=speed+'× 速度'};
function render(now){let dt=Math.min(100,now-last);last=now;if(playing)elapsed+=dt*speed;ctx.clearRect(0,0,cv.width,cv.height);if(image){const d=data.find(x=>x[0]===selected),f=Math.floor(elapsed%d[7]/d[7]*d[2]),sw=(d[5]-d[3])/d[2],sh=d[6]-d[4],scale=Math.min(cv.width/sw,cv.height/sh,2);ctx.drawImage(image,d[3]+sw*f,d[4],sw,sh,(cv.width-sw*scale)/2,(cv.height-sh*scale)/2,sw*scale,sh*scale);$('progress').textContent=(f+1)+' / '+d[2]+' 帧 · 原图分区预览'}requestAnimationFrame(render)}requestAnimationFrame(render);
async function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open('naili-review-images',1);r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function loadBlob(blob){const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{image=img;$('board').src=url;$('fileStatus').textContent=' ✓ 原图已加载（'+img.width+'×'+img.height+'）'};img.src=url}
$('upload').onchange=async()=>{const f=$('upload').files[0];if(!f)return;await loadBlob(f);try{const database=await db();database.transaction('images','readwrite').objectStore('images').put(f,'approved-v11')}catch(e){$('fileStatus').textContent+='（本机保存失败）'}};
(async()=>{try{const database=await db();const tx=database.transaction('images');const req=tx.objectStore('images').get('approved-v11');req.onsuccess=()=>{if(req.result)loadBlob(req.result)}}catch{}})();
$('export').onclick=()=>{save();const blob=new Blob([JSON.stringify({version:'Gen1 v1.1',reviews},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='naili-v11-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('copy').onclick=async()=>{save();const text=data.map(d=>d[1]+'：'+(reviews[d[0]]?.rating||'未审核')+'\n'+(reviews[d[0]]?.notes||'')).join('\n\n');try{await navigator.clipboard.writeText(text);$('copy').textContent='✓ 已复制'}catch{$('copy').textContent='请使用导出'}};
select('idle');
</script></body></html>
