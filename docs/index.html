<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2e2228"><title>奶栗 · 手机审核台</title><style>
:root{color-scheme:dark;--bg:#291e26;--wood:#b47b57;--gold:#ffdfa3;--cream:#fff0d0;--line:#80514b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#52343b,var(--bg) 68%);color:var(--cream);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;padding:18px 15px 90px}main{max-width:560px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:22px;margin:0;color:var(--gold)}.sub{font-size:12px;color:#d8b9ab;margin:8px 0 22px}.tag{font-size:11px;border:1px solid #b98465;padding:5px 8px;color:#ffe1ad}.wood{background:#9d654e;border:5px solid #6b3e3c;box-shadow:0 6px #3c292f,inset 0 0 0 3px #e1ac74;padding:9px;margin-top:44px;position:relative}.pet-stage{height:90px;display:flex;justify-content:center;align-items:end;margin-top:-75px;position:relative;pointer-events:none}canvas{width:124px;height:124px;image-rendering:pixelated}.roof{background:#70454a;border:3px solid #d49a6d;color:#ffe0ac;padding:8px 10px;display:flex;justify-content:space-between;font-size:12px}.screen{background:#3d3044;border:3px solid #79505b;padding:14px 10px 12px;text-align:center}.screen small{font-size:12px;color:#e9c8a7}.timer{font:900 clamp(30px,9vw,44px) ui-monospace,monospace;letter-spacing:2px;color:#ffdf9c;margin:5px 0 12px;text-shadow:2px 3px #88595d}.incomes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.income{border:2px solid #94746d;background:#554651;text-align:left;padding:8px}.income b{display:block;color:#d4f0ad;font:700 clamp(16px,4.5vw,21px) ui-monospace,monospace;margin-top:5px}.income:last-child b{color:#ffe0b4}.income small{font-size:11px}.section{margin-top:26px}.section h2{font-size:16px;margin:0 0 12px;color:#ffdfae}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.action,.rate,.control{border:2px solid #b78161;background:#4b3440;color:#ffe8c6;border-radius:3px;padding:12px 8px;font-size:13px;cursor:pointer}.action[aria-pressed=true]{background:#ad7556;color:#271d24;font-weight:800}.action small{display:block;opacity:.75;margin-top:4px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}.control{padding:8px 12px}.status{font-size:12px;color:#d7b9ab}.review{background:#382934;border:2px solid #79565b;padding:13px;margin-top:14px}.review-title{font-size:14px;font-weight:700;margin-bottom:12px}.rating{display:flex;gap:7px}.rate{flex:1;padding:9px 4px;font-size:12px}.rate[aria-pressed=true]{background:#e5b67e;color:#2c2027;font-weight:800}textarea{width:100%;min-height:88px;background:#251d27;border:2px solid #89645c;color:#fff0d0;padding:10px;margin-top:11px;font:14px system-ui;resize:vertical}button:focus-visible,textarea:focus-visible{outline:3px solid #ffdf9c;outline-offset:2px}.hint{font-size:12px;color:#c5a9a7;line-height:1.6}.wide{width:100%;margin-top:10px}.footer{font-size:11px;color:#ae9290;margin-top:24px;line-height:1.6}.sr{position:absolute;left:-9999px}@media(min-width:500px){.pet-stage{height:105px}}
</style></head><body><main><header><h1>🐰 奶栗 · 动画审核台</h1><span class="tag">Gen 1 · v1.2</span></header><p class="sub">手机浏览器可用 · 角色动画技术预览 · 审核记录保存在本机</p>
<div class="wood"><div class="pet-stage"><canvas id="pet" width="128" height="128" aria-label="奶栗像素兔子动作预览"></canvas></div><div class="roof"><span>✿ 奶栗 NAILI</span><span>⚙ 预览</span></div><div class="screen"><small id="clockLabel">距离下班还有 · 演示</small><div class="timer" id="clock">02:35:48</div><div class="incomes"><div class="income"><small>今日收入</small><b>¥186.42</b></div><div class="income"><small>本月总收入</small><b>¥4,382.65</b></div></div></div></div>
<section class="section"><h2>动作预览</h2><div class="actions" id="actions"></div><div class="controls"><button class="control" id="play">⏸ 暂停</button><button class="control" id="speed">1× 速度</button><span class="status" id="status">正在预览：坐下</span></div></section>
<section class="section"><h2>审核当前动作</h2><div class="review"><div class="review-title" id="reviewTitle">坐下 · 审核意见</div><div class="rating"><button class="rate" data-rate="通过">✓ 通过</button><button class="rate" data-rate="修改">✎ 需修改</button><button class="rate" data-rate="待定">◷ 待定</button></div><textarea id="notes" placeholder="例如：耳朵太短、围脖太厚、脚底没有贴住木框……"></textarea><p class="hint">切换动作时自动保存当前审核记录，仅保存在这台手机的浏览器中。</p></div><button class="control wide" id="export">⬇ 导出审核意见 JSON</button><button class="control wide" id="copy">复制审核意见文本</button></section>
<p class="footer">说明：此页采用与仓库生成脚本一致的角色造型规则制作轻量级像素动画预览。它不是 Electron 实机录像，也不是前一张美术审核图的逐帧还原。收入和倒计时均为演示值。</p></main>
<script>
const ACTIONS=[['roofSit','坐下',6],['roofLie','趴卧',8],['roofStretch','伸懒腰',8],['roofWake','起身',6],['walk','行走示意',8],['sleep','睡觉示意',12]];
const storeKey='naili-mobile-review-v12';let reviews={};try{reviews=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch{}
const $=id=>document.getElementById(id),canvas=$('pet'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
let current='roofSit',paused=false,speed=1,phase=0,last=performance.now(),frame=0;
function save(){reviews[current]={...(reviews[current]||{}),notes:$('notes').value};try{localStorage.setItem(storeKey,JSON.stringify(reviews))}catch{}}
function choose(name){save();current=name;phase=0;frame=0;const record=reviews[name]||{};$('notes').value=record.notes||'';$('reviewTitle').textContent=ACTIONS.find(a=>a[0]===name)[1]+' · 审核意见';document.querySelectorAll('.action').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.action===name)));document.querySelectorAll('.rate').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.rate===record.rating)));$('status').textContent='正在预览：'+ACTIONS.find(a=>a[0]===name)[1]}
ACTIONS.forEach(([name,label,n])=>{const b=document.createElement('button');b.className='action';b.dataset.action=name;b.innerHTML=label+'<small>'+n+' 帧 · '+(name==='roofSit'||name==='roofLie'?'循环':'演示')+'</small>';b.onclick=()=>choose(name);$('actions').append(b)});
document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>{reviews[current]={...(reviews[current]||{}),rating:b.dataset.rate};save();document.querySelectorAll('.rate').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
$('notes').addEventListener('input',save);$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'▶ 播放':'⏸ 暂停'};$('speed').onclick=()=>{speed=speed===1?0.5:speed===0.5?2:1;$('speed').textContent=speed+'× 速度'};
function report(){save();return '奶栗 Gen1 v1.2 手机审核\n'+ACTIONS.map(([id,label])=>{const r=reviews[id]||{};return label+'：'+(r.rating||'未审核')+(r.notes?'\n意见：'+r.notes:'')}).join('\n\n')}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());$('copy').textContent='✓ 已复制'}catch{$('copy').textContent='复制失败，请使用导出'}};
$('export').onclick=()=>{save();const blob=new Blob([JSON.stringify({project:'naili-desktop',version:'Gen1 v1.2',reviews},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='naili-review-v12.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function sprite(t){
 const frameSize=64;const off=document.createElement('canvas');off.width=off.height=frameSize;const d=off.getContext('2d');d.imageSmoothingEnabled=false;
 const wobble=Math.sin(t*Math.PI*2),lower=current==='roofLie'||current==='sleep'||current==='roofWake'&&t<.5;const stretch=current==='roofStretch'&&t>.2&&t<.8;const hop=current==='walk'?Math.abs(wobble)*2:0;
 const y=33+(lower?5:0)-hop+Math.round(wobble*(lower?1:0));const c='#c88b5c',light='#e5b587',dark='#9b603f',cream='#f5e3c6';
 function e(box,fill,outline){d.fillStyle=fill;d.beginPath();d.ellipse((box[0]+box[2])/2,(box[1]+box[3])/2,(box[2]-box[0])/2,(box[3]-box[1])/2,0,0,Math.PI*2);d.fill();if(outline){d.strokeStyle=outline;d.lineWidth=1;d.stroke()}}
 e([43,y+14,54,y+25],c,dark);e([15,y+9,51,y+(lower?28:31)],c,dark);e([18,y+9,44,y+24],light);e([19,y+14,45,y+29],cream);
 const hy=y-(stretch?7:0);e([15,hy-12,42,hy+15],c,dark);
 for(const [x,k] of [[21,-1],[34,1]]){const top=hy-31+(lower?8:0);e([x-5+k,top,x+5+k,hy-8],c,dark);e([x-2+k,top+4,x+2+k,hy-11],'#e7a4a2')}
 d.fillStyle='#fff0df';d.fillRect(28,hy-10,4,13);e([14,hy+1,25,hy+12],cream);e([31,hy+1,42,hy+12],cream);e([23,hy+6,35,hy+14],'#fff2df');
 d.fillStyle='#4d3433';if(lower){d.fillRect(21,hy+4,4,1);d.fillRect(34,hy+4,4,1)}else{d.fillRect(23,hy+2,2,3);d.fillRect(35,hy+2,2,3)}
 d.fillStyle='#d58f96';d.fillRect(29,hy+8,3,2);e([17,y+24,25,y+29],light);e([38,y+24,47,y+29],light);
 ctx.clearRect(0,0,128,128);ctx.drawImage(off,0,0,128,128);
}
function loop(now){const dt=Math.min(100,now-last);last=now;if(!paused)phase+=dt*speed/((current==='roofLie'||current==='sleep')?2600:current==='roofSit'?1800:current==='roofStretch'?1250:current==='roofWake'?950:720);const count=ACTIONS.find(a=>a[0]===current)[2];frame=Math.floor((phase%1)*count);sprite(frame/count);requestAnimationFrame(loop)}choose('roofSit');requestAnimationFrame(loop);
</script></body></html>
