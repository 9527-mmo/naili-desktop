<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奶栗倒计时</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#f5e5b6;font-family:ui-monospace,Menlo,monospace;user-select:none}.panel{margin:5px;background:#25263b;border:4px solid #c39c68;box-shadow:0 5px 0 #121827,0 0 0 3px #fff3d0 inset;padding:12px 15px;height:220px;image-rendering:pixelated}.header{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#f5c785}.header button,.settings button{background:#594b62;color:#fff3d0;border:2px solid #bd9b72;cursor:pointer}.time{text-align:center;margin:8px 0 10px}.time small{font-size:12px;color:#d7d3ca}.digits{font-size:31px;letter-spacing:3px;font-weight:900;text-shadow:3px 3px #76545a;font-variant-numeric:tabular-nums}.earnings{display:flex;gap:10px}.earnings>div{flex:1;background:#38364b;padding:8px;border:2px solid #746878}.earnings small{display:block;color:#b7afc4;font-size:11px}.earnings strong{font-size:18px;color:#a9e2ae;font-variant-numeric:tabular-nums}.footer{margin-top:9px;font-size:10px;color:#a7a0ba;text-align:center}.settings{position:absolute;inset:5px;background:#29283d;border:4px solid #c39c68;padding:13px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}.settings[hidden]{display:none}.settings label{display:flex;flex-direction:column;gap:4px}.settings input,.settings select{width:100%;padding:5px;background:#f8eacf;color:#28283d;border:2px solid #c39c68}.settings .actions{grid-column:span 2;display:flex;justify-content:flex-end;gap:10px}.settings button{padding:5px 13px}
</style></head><body><main class="panel" id="panel"><div class="header"><span>🐰 NAILI · 下班计划</span><button id="config" title="设置">⚙ 设置</button></div><div class="time"><small id="count-label">距离下班</small><div class="digits" id="count">--:--:--</div></div><div class="earnings"><div><small>今日收入</small><strong id="today">¥ 0.00</strong></div><div><small>本月累计</small><strong id="month">¥ 0.00</strong></div></div><div class="footer" id="info">8-BIT · 每秒更新 · 奶栗陪你下班</div></main>
<section class="settings" id="settings" hidden><label>上班时间<input id="start" type="time"></label><label>下班时间<input id="end" type="time"></label><label>月薪（元）<input id="salary" type="number" min="0" max="100000000" step="0.01"></label><label>计薪方式<select id="mode"><option value="work">按工作时间累计</option><option value="calendar">整月 24 小时均摊</option></select></label><div class="actions"><button id="cancel">取消</button><button id="save">保存</button></div></section>
<script src="./countdown.js"></script></body></html>
