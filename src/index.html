<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奶栗桌面宠物</title><link rel="stylesheet" href="./style.css"></head>
<body><div id="app"><canvas id="pet" width="720" height="780" aria-label="奶栗兔子"></canvas>
<div id="toolbar"><button data-action="feed" title="喂食">🥕</button><select id="food-choice" title="选择食物"><option value="hay">🌾 提摩西草</option><option value="orchard">🌿 果园草</option><option value="alfalfa">🌱 苜蓿草</option><option value="pellet">🥣 兔粮</option><option value="carrot">🥕 胡萝卜</option><option value="leaf">🥬 叶菜</option><option value="apple">🍎 苹果</option><option value="herb">🍃 香草</option></select><button data-action="pet" title="摸摸">🤍</button><button data-action="sleep" title="睡觉">🌙</button><button data-action="play" title="玩耍">✨</button><button id="settings-toggle" title="设置" aria-expanded="false">⚙️</button><button data-action="quit" title="退出">×</button></div>
<section id="settings" hidden aria-label="宠物设置">
  <strong>奶栗设置</strong>
  <label class="toggle"><input id="follow-toggle" type="checkbox"> 跟随鼠标</label>
  <label class="toggle"><input id="fullscreen-toggle" type="checkbox"> 全屏活动范围</label>
  <p class="hint">开启后可离开默认活动区域，跟随鼠标或自由探索整个桌面及其他显示器；不会创建遮挡屏幕的全屏窗口。</p>
  <label class="range-label" for="scale-slider">角色大小 <output id="scale-value">100%</output></label>
  <input id="scale-slider" type="range" min="50" max="200" step="5" value="100">
  <label class="range-label" for="delay-slider">跟随延迟 <output id="delay-value">350 ms</output></label>
  <input id="delay-slider" type="range" min="0" max="1500" step="50" value="350">
  <label class="toggle"><input id="active-feed-toggle" type="checkbox"> 开启主动投喂</label><p class="hint">在奶栗窗口内双击鼠标右键，挑选食物后投喂；全局右键监听需要单独的 macOS 权限适配。</p><label class="toggle"><input id="toilet-toggle" type="checkbox"> 定时上厕所</label><button id="set-toilet" type="button" class="wide-button">📍 将奶栗当前位置设为厕所</button><p id="toilet-status" class="hint">尚未设置厕所位置</p><p class="hint">启用后每隔随机时间前往厕所；进食和睡眠时不会立即打断。</p><p id="follow-description" class="hint">关闭跟随后奶栗会自由活动</p>
</section>
<section id="feed-menu" hidden aria-label="主动投喂"><strong>🥕 投喂奶栗</strong><p class="hint">选择食物，奶栗会跑来叼走</p><select id="feed-menu-choice"><option value="hay">🌾 提摩西草</option><option value="orchard">🌿 果园草</option><option value="alfalfa">🌱 苜蓿草</option><option value="pellet">🥣 兔粮</option><option value="carrot">🥕 胡萝卜</option><option value="leaf">🥬 叶菜</option><option value="apple">🍎 苹果</option><option value="herb">🍃 香草</option></select><button id="feed-confirm" class="wide-button">投喂</button><button id="feed-cancel" class="wide-button">取消</button></section><div id="status" role="status" aria-live="polite">奶栗来啦！</div></div>
<script src="./animation-controller.js"></script><script src="./behavior-director.js"></script><script src="./character-loader.js"></script><script src="./renderer.js"></script></body></html>
